name: Deploy guide site

# Publishes the user guide at site/ to GitHub Pages.
# Only site/ is uploaded — docs/ holds work-request records and must not be
# indexed as part of the site.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy would leave the published site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy run in separate jobs: when deploy-pages ran right after the
# upload in the same job, the artifact was sometimes not listed yet
# ("No artifacts named github-pages were found").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
